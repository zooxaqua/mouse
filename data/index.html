<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="/framework/milligram.min.css">

    <link
        rel="stylesheet"
        href="/css/style.css">
        
    <title>M5Stamp-Pico</title>
</head>

<body>

<main class="container">

    <script src="/js/script.js"></script>


    <!-- =====================================================
         Header
         ===================================================== -->

    <h1>M5Stamp-Pico</h1>

    <p>
        Web Controller
    </p>


    <!-- =====================================================
         Debug Console
         ===================================================== -->

    <section class="debug-console">

        <h2>
            Debug Console
        </h2>

        <div
            id="debugConsole"
            class="debug-console-log">
        </div>

    </section>


    <!-- =====================================================
         Controller
         ===================================================== -->

    <h2>Controller</h2>

    <div class="controller">


        <!-- -------------------------------------------------
             D-Pad
             ------------------------------------------------- -->

        <div class="dpad">

            <button
                id="dpadUp"
                class="dpad-up">
                ↑
            </button>

            <button
                id="dpadLeft"
                class="dpad-left">
                ←
            </button>

            <button
                id="dpadRight"
                class="dpad-right">
                →
            </button>

            <button
                id="dpadDown"
                class="dpad-down">
                ↓
            </button>

        </div>


        <!-- -------------------------------------------------
             Left Stick
             ------------------------------------------------- -->

        <div class="joystick">

            <label class="joystick-label">
                Left Stick
            </label>

            <div
                id="leftStick"
                class="joystick-pad">

                <div class="joystick-knob"></div>

            </div>

            <input
                class="joystick-value"
                id="leftStickValue"
                type="text"
                value="X: 0 / Y: 0"
                readonly>

        </div>


        <!-- -------------------------------------------------
             Right Stick
             ------------------------------------------------- -->

        <div class="joystick">

            <label class="joystick-label">
                Right Stick
            </label>

            <div
                id="rightStick"
                class="joystick-pad">

                <div class="joystick-knob"></div>

            </div>

            <input
                class="joystick-value"
                id="rightStickValue"
                type="text"
                value="X: 0 / Y: 0"
                readonly>

        </div>


        <!-- -------------------------------------------------
             A / B / X / Y
             ------------------------------------------------- -->

        <div class="abxy">

            <button
                id="buttonY"
                class="button-y">
                Y
            </button>

            <button
                id="buttonX"
                class="button-x">
                X
            </button>

            <button
                id="buttonB"
                class="button-b">
                B
            </button>

            <button
                id="buttonA"
                class="button-a">
                A
            </button>

        </div>

    </div>

</main>

</body>

</html>
